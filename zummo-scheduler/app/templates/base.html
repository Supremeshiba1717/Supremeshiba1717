<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Zummo Bike Scheduler{% endblock %}</title>
  <style>
    :root { --navy: #1f4e79; --bg: #f0f4f8; --line: #d0d7de; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           margin: 0; color: #1a1a1a; background: #fff; }
    header { background: var(--navy); color: #fff; padding: 14px 22px;
             display: flex; align-items: center; gap: 20px; }
    header h1 { font-size: 18px; margin: 0; }
    header a { color: #cfe0f0; text-decoration: none; font-size: 14px; }
    header a:hover { color: #fff; }
    main { max-width: 900px; margin: 0 auto; padding: 22px; }
    h2 { border-bottom: 2px solid var(--bg); padding-bottom: 6px; margin-top: 28px; }
    table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
    th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
    th { background: var(--navy); color: #fff; }
    tbody tr:nth-child(even) { background: var(--bg); }
    .center { text-align: center; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 11px;
            font-size: 12px; font-weight: 600; }
    .pill.parsed { background: #d4edda; color: #155724; }
    .pill.unparsed, .pill.pending { background: #fff3cd; color: #856404; }
    .pill.needs_review, .pill.no_response, .pill.declined, .pill.expired {
            background: #f8d7da; color: #721c24; }
    .pill.accepted { background: #d4edda; color: #155724; }
    button, input[type=submit] { cursor: pointer; border: 1px solid var(--navy);
            background: var(--navy); color: #fff; padding: 7px 14px;
            border-radius: 6px; font-size: 13px; }
    button.ghost { background: #fff; color: var(--navy); }
    form.inline { display: inline; }
    input, select { padding: 6px 8px; border: 1px solid var(--line);
            border-radius: 6px; font-size: 13px; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 16px;
            margin: 14px 0; }
    .muted { color: #666; font-size: 13px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .warn { color: #721c24; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>🚲 Zummo Bike Scheduler</h1>
    <a href="/">Dashboard</a>
    <a href="/employees">Employees</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
